<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi tarjeta — M3 Padel Academy</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
  <h1>M3 Padel Academy</h1>
  <div class="sub">Tu tarjeta de fidelización</div>
  <div id="card-area"><div class="empty">Cargando...</div></div>
</div>

<script>
function getCode() {
  const params = new URLSearchParams(location.search);
  return params.get('code');
}

async function load() {
  const code = getCode();
  const area = document.getElementById('card-area');
  if (!code) {
    area.innerHTML = '<div class="empty">Link inválido. Pide tu link a la academia.</div>';
    return;
  }
  const res = await fetch('/api/alumno/' + code);
  if (!res.ok) {
    area.innerHTML = '<div class="empty">No encontramos tu tarjeta. Pide tu link a la academia.</div>';
    return;
  }
  const s = await res.json();
  const pct = Math.min(100, Math.round((s.clases / s.target) * 100));

  area.innerHTML = `
    <div class="card-front">
      <div class="card-head">
        <div class="logo">
          <div class="logo-box"><div class="logo-dot"></div></div>
          <div class="logo-text">M3 PADEL ACADEMY</div>
        </div>
        <span class="badge" style="background:${s.levelInfo.color};color:${s.levelInfo.textColor}">${s.levelInfo.label}</span>
      </div>
      <div>
        <div class="name">${s.nombre}</div>
        <div class="subid">Socio N.o ${s.code}</div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="color:#8a8a8a; font-size:11px;">Estado de pago</span>
        <span class="badge" style="background:${s.pagoAlDia ? '#1f3d14' : '#3d1414'};color:${s.pagoAlDia ? '#a8e02e' : '#e06060'};">${s.pagoAlDia ? 'Al día' : 'Pendiente'}</span>
      </div>
      <div>
        <div class="progress-label">
          <span style="color:#8a8a8a">Clases este trimestre</span>
          <span style="color:#a8e02e; font-weight:500">${s.clases} / ${s.target}</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
    </div>
    <div class="benefits">
      <h3>Progreso hacia nivel Oro</h3>
      <div class="progress-label">
        <span style="color:#8a8a8a">Torneos jugados</span>
        <span style="color:#a8e02e; font-weight:500">${s.torneos} / ${s.torneosTarget}</span>
      </div>
      <div class="progress-track" style="margin-bottom:14px;"><div class="progress-fill" style="width:${Math.min(100, Math.round((s.torneos / s.torneosTarget) * 100))}%"></div></div>
      <div class="progress-label">
        <span style="color:#8a8a8a">Posteos en RR.SS.</span>
        <span style="color:#a8e02e; font-weight:500">${s.posteos} / ${s.posteosTarget}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100, Math.round((s.posteos / s.posteosTarget) * 100))}%"></div></div>
    </div>
    <div class="benefits" style="margin-top:16px;">
      <h3>Beneficios nivel ${s.levelInfo.label}</h3>
      <ul>${s.levelInfo.benefits.map((b) => `<li>${b}</li>`).join('')}</ul>
    </div>
  `;
}

load();
</script>
</body>
</html>
